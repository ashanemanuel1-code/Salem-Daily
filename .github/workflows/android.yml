name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
      - name: App icon
        working-directory: android-app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../public/icons/icon.png assets/icon-only.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0b0f' --iconBackgroundColorDark '#0b0b0f'
      - name: Build APK
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk SalemDaily.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Salem Daily APK ${{ github.run_number }}
          files: SalemDaily.apk
